# Render Blueprint: one web service and one PostgreSQL database.
# Variables marked "sync: false" are asked for when the Blueprint is first applied
# and can be changed later under the service's Environment tab.
services:
  - type: web
    name: kasturi-auction
    runtime: node
    plan: free
    region: singapore # closest Render region to India; keep it the same as the database
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: kasturi-auction-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: BASE_URL
        sync: false
      - key: SEED_DEMO # 'true' fills an empty database with demo auctions and bidders for review
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

databases:
  - name: kasturi-auction-db
    plan: free
    region: singapore
